/* THE SPACE interface: mint glass, upper arc and three lower circles */
:root{--mint:#D7F9F1;--green:#7AA095;--ink:#244c55;--teal:#0b918b;--line:#d6e9e5}
html{min-height:100%;background:#e9f8f4}
body{background:radial-gradient(ellipse at 10% 94%,#bdf3e8 0,transparent 28%),radial-gradient(ellipse at 55% 42%,#f7fffd 0,transparent 62%),linear-gradient(125deg,#d5f7ef 0%,#eaf9f5 55%,#e6f6f2 100%);min-height:100vh;position:relative;isolation:isolate}
body:before{top:-360px;left:auto;right:-180px;width:860px;height:520px;border:1.5px solid rgba(255,255,255,.83);transform:rotate(13deg);box-shadow:0 24px 0 0 rgba(255,255,255,.17),0 44px 0 0 rgba(255,255,255,.12);z-index:-1}
body:after{content:"";position:fixed;left:-45px;bottom:-90px;width:280px;height:210px;border:1px solid rgba(255,255,255,.85);border-radius:50%;pointer-events:none;box-shadow:85px -65px 0 -66px rgba(255,255,255,.9),145px 10px 0 -78px rgba(255,255,255,.8);z-index:-1}
.shell:before,.shell:after{content:"";position:fixed;pointer-events:none;z-index:-1;border:1.5px solid rgba(255,255,255,.9);border-radius:50%;background:rgba(255,255,255,.13)}
.shell:before{left:2%;bottom:8%;width:95px;height:95px}.shell:after{left:10%;bottom:3%;width:64px;height:64px}
.glass{background:rgba(255,255,255,.55);border:1.5px solid rgba(255,255,255,.96);box-shadow:0 15px 34px rgba(56,113,102,.10),inset 0 1px 1px rgba(255,255,255,.85);-webkit-backdrop-filter:blur(19px);backdrop-filter:blur(19px)}
.qcard,.suspect,.clue,.item{background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.92);box-shadow:0 5px 15px rgba(70,140,125,.07)}
.story-copy{font-size:20px;line-height:1.65;padding:24px 27px}
.story-copy p{margin:0 0 19px}.story-copy p:last-child{margin-bottom:0}
.suspect{min-height:195px;align-items:center;gap:22px;padding:18px}
.portrait{width:132px;height:148px;object-fit:cover;object-position:center 18%;border-radius:17px}
.suspect h3{font-size:24px;margin:0 0 8px;color:#147e79}
.suspect p{font-size:21px;line-height:1.48;font-weight:700;margin:0;overflow-wrap:anywhere}
.clue{grid-template-columns:180px minmax(0,1fr);gap:18px;padding:16px;min-height:155px}
.clue img{width:180px;height:128px;object-fit:cover;object-position:center 24%}
.clue strong{font-size:18px}.clue p{font-size:17px;line-height:1.5}
.qcard{font-size:17px}.qcard strong{font-size:18px}.option{padding:7px 0}
.item{font-size:17px;line-height:2.1}.lead{font-size:17px}
.logo{margin:22px 12px 0 auto;width:138px;height:auto;line-height:normal}.logo:before{display:none}.logo img{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 5px rgba(40,105,98,.09))}
.page{min-height:540px}.page h2{color:#168c85}
@media(max-width:800px){.story-copy{font-size:18px;padding:19px}.suspect p{font-size:19px}.suspect{min-height:0}.clue{grid-template-columns:120px minmax(0,1fr)}.clue img{width:120px;height:105px}.clue p{font-size:15px}.portrait{width:104px;height:122px}}

const KEY='thespace-missing-trophy-v5';const ENDPOINT='https://script.google.com/macros/s/AKfycbzWP_YKcWWrQbcrMtftSBAdhXYGF3TT-_Sjn8b3NcNWviG1Qt1o6hz4iL5w0nLWaCbdPw/exec';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}state=Object.assign({page:0,unlocked:0,completed:[false,false,false,false],answers:{},solved:false,name:'',teacher:false,teacherAnswers:false,sent:false},state||{});function save(){localStorage.setItem(KEY,JSON.stringify(state))}function img(name,cls=''){return `<img class="${cls}" src="${IMG[name]}" alt="Detective case illustration">`}function field(id,placeholder='Type your answer'){return `<input class="blank" id="${id}" data-field="${id}" aria-label="${placeholder}" placeholder="${placeholder}" autocomplete="off" value="${esc(state.answers[id]||'')}">`}function esc(s){return String(s).replace(/[&"<>]/g,c=>({'&':'&amp;','"':'&quot;','<':'&lt;','>':'&gt;'}[c]))}function nav(){let names=['The Crime Scene','The Suspects','The Evidence',"Detective’s Report"];document.getElementById('steps').innerHTML=names.map((n,i)=>`<button class="step ${i===state.page?'active':''} ${i>state.unlocked&&!state.teacher?'locked':''} ${state.completed[i]?'done':''}" ${i>state.unlocked&&!state.teacher?'disabled':''} onclick="go(${i})"><span>${i+1}</span>${n}</button>`).join('')}function go(i){if(i<0||(i>state.unlocked&&!state.teacher)||i>3)return;capture();state.page=i;save();render()}function capture(){document.querySelectorAll('[data-field]').forEach(el=>{state.answers[el.dataset.field]=el.value});document.querySelectorAll('[data-radio]:checked').forEach(el=>{state.answers[el.dataset.radio]=el.value});save()}function checked(id,val){return state.answers[id]===val?'checked':''}function options(id,choices){return choices.map((c,i)=>`<label class="option"><input type="radio" data-radio="${id}" name="${id}" value="${i}" ${checked(id,String(i))}> ${esc(c)}</label>`).join('')}function buttons(nextText='Next →'){return `<div class="footer"><button class="btn secondary" onclick="go(${state.page-1})" ${state.page===0?'disabled':''}>← Back</button><button class="btn" onclick="check()">${state.page===3?'Solve the Case':'Check Answers ✓'}</button>${state.page<3?`<button class="btn secondary" onclick="go(${state.page+1})" ${state.page>=state.unlocked&&!state.teacher?'disabled':''}>${nextText}</button>`:'<span></span>'}</div><p id="feedback" class="feedback" aria-live="polite"></p>`}function render(){let p=document.getElementById('page');let steps=document.getElementById('steps');if(!state.name){steps.innerHTML='';p.innerHTML=`<section class="login glass"><div class="login-icon">🔎</div><h2>Welcome, Detective!</h2><p class="lead">Enter your name to start the investigation.</p><form onsubmit="login(event)"><label for="student-name">Your name</label><input id="student-name" class="blank" maxlength="80" autocomplete="name" required placeholder="Enter your name"><button class="btn" type="submit">Start Investigation →</button></form><p id="login-error" class="feedback"></p></section>`;return}nav();p.innerHTML=(state.teacher?`<div class="teacherbar"><b>Teacher Mode</b><button class="btn secondary" onclick="toggleTeacherAnswers()">${state.teacherAnswers?'Hide Answers':'Show Answers'}</button><button class="btn secondary" onclick="teacherSolution()">Show Solution</button><button class="btn secondary" onclick="logout()">Log out</button></div>`:`<div class="studentbar">Detective: <b>${esc(state.name)}</b> <button class="logout" onclick="logout()">Log out</button></div>`)+[page1,page2,page3,page4][state.page]();if(state.solved&&state.page===3){showResult();if(!state.sent&&!state.teacher)submitResults()}if(state.teacher&&state.teacherAnswers)showTeacherAnswers()}
function login(e){e.preventDefault();let name=document.getElementById('student-name').value.trim();if(!name)return;state.name=name;state.teacher=name.toLowerCase()==='teacher';state.teacherAnswers=false;state.page=0;if(state.teacher)state.unlocked=3;save();render()}
function logout(){if(!confirm('Log out of the investigation?'))return;state.name='';state.teacher=false;state.teacherAnswers=false;state.page=0;save();render()}
function toggleTeacherAnswers(){state.teacherAnswers=!state.teacherAnswers;save();render()}
function teacherSolution(){if(!state.teacher)return;state.page=3;state.teacherAnswers=true;save();render();let e=document.getElementById('teacher-key');if(e)e.scrollIntoView({behavior:'smooth',block:'center'})}
function showTeacherAnswers(){const qs=['A sports trophy','At 8:30 pm','Four','What everyone was doing at 8:30 pm'];let lines=state.page===0?qs.map((a,i)=>`${i+1}. ${a}`):state.page===1?grammar.map((g,i)=>`${i+1}. ${g[4]}`):state.page===2?evGrammar.map((g,i)=>`${i+1}. ${g[4]}`):['Tom: was practising in the music room — True','Emma: was working on a presentation — True','Lucy: was talking to her brother — True','Jack: was carrying a sports bag — False','Who took the trophy? Jack','Reason: Jack said he was watching basketball practice, but the gym was empty and practice had finished at 8:00 pm.'];let d=document.createElement('div');d.id='teacher-key';d.className='teacherkey glass';d.innerHTML='<h3>Teacher Answer Key</h3>'+lines.map(x=>'<p>'+esc(x)+'</p>').join('');p=document.getElementById('page');p.appendChild(d)}

function page1(){let qs=[['What disappeared from the school?',['A painting','A sports trophy','A laptop']],['When did the detective discover that the trophy was missing?',['At 8:00 pm','At 8:30 pm','At 9:30 pm']],['How many people were still at school?',['Three','Four','Five']],['What does the detective need to find out?',['Who won the competition','What everyone was doing at 8:30 pm','Who organised the ceremony']]];return `<h2>The Crime Scene</h2><p class="lead">Read the story carefully. Every detail could be important.</p><div class="story">${img('scene','scene')}<div class="story-copy glass"><p>On Friday evening, the school held an awards ceremony. Later that evening, the main sports trophy went missing from its display case.</p><p>At 8:00 pm, the trophy was still there. At 8:30 pm, the case was empty.</p><p>Only four students were still at school: Tom, Emma, Lucy and Jack. The detective needs to find out what everyone was doing at 8:30 pm.</p><p><b>Can you solve the mystery?</b></p></div></div><h3>Choose the correct answers.</h3><div class="questions">${qs.map((q,i)=>`<div class="qcard"><strong>${i+1}. ${q[0]}</strong>${options('q'+i,q[1])}</div>`).join('')}</div>${buttons()}`}
const suspects=[['Tom','tom','I was practising for the school concert in the music room.'],['Emma','emma','My friend and I were working on our presentation in the computer room.'],['Lucy','lucy','I was talking to my brother on the phone near the library.'],['Jack','jack','I was watching the basketball team train in the gym.']];const grammar=[['g0','Tom','(practise)','for the concert at 8:30.','was practising'],['g1','Emma and her friend','(work)','on a presentation.','were working'],['g2','Lucy','(talk)','to her brother on the phone.','was talking'],['g3','Jack','(watch)','basketball training.','was watching'],['g4','The students','(not leave)','the school at 8:00.','were not leaving'],['g5','What','(Tom / do)','at 8:20?','was Tom doing'],['g6','Emma','(not play)','basketball at 8:25.','was not playing'],['g7','Where','(Jack / wait)','at 8:30?','was Jack waiting']];function page2(){return `<h2>The Suspects</h2><p class="lead">Read the four alibis. Then complete the detective’s notes with Past Continuous.</p><div class="suspects">${suspects.map(s=>`<div class="suspect">${img(s[1],'portrait')}<div><h3>${s[0]}</h3><p>“${s[2]}”</p></div></div>`).join('')}</div><div class="exercise glass"><h3>Complete with was / were and the -ing form. Use full forms.</h3><div class="items">${grammar.map((g,i)=>`<div class="item"><b>${i+1}.</b> ${g[1]} ${field(g[0],'was/were + -ing')} ${g[2]} ${g[3]}</div>`).join('')}</div></div>${buttons()}`}
const evGrammar=[['e0','At 8:30, someone','(carry)','a large sports bag along the corridor.','was carrying'],['e1','At 8:20, Tom','(practise)','in the music room.','was practising'],['e2','At 8:25, Emma and her friend','(work)','on their presentation.','were working'],['e3','At 8:30, the basketball players','(not train)','in the gym.','were not training'],['e4','At 8:30, Lucy','(talk)','to her brother on the phone.','was talking'],['e5','Why','(Jack / wear)','his basketball shirt?','was Jack wearing']];function clue(k,title,desc){return `<div class="clue">${img(k)}<div><strong>${title}</strong><p>${desc}</p></div></div>`}function page3(){return `<h2>The Evidence</h2><p class="lead">Study the clues. Look for a contradiction in the alibis.</p><div class="evidence">${clue('cctv','Clue 1 · CCTV · 8:30 pm','The camera showed a student carrying a large sports bag past the trophy case.')}${clue('music','Clue 2 · Music room · 8:20–8:40 pm','The music teacher said that Tom was practising with the school band from 8:20 to 8:40 pm.')}${clue('presentation','Clue 3 · Computer room · 8:25 pm','A photo shows Emma and her friend working together on their presentation.')}${clue('gym','Clue 4 · Gym · 8:30 pm','The gym was empty. Basketball practice finished at 8:00 pm.')}${clue('phone','Clue 5 · Phone call · 8:20–8:40 pm','The phone records show that Lucy was talking to her brother from 8:20 to 8:40 pm.')}</div><div class="exercise glass"><h3>Complete the evidence notes using Past Continuous.</h3><div class="items">${evGrammar.map((g,i)=>`<div class="item"><b>${i+1}.</b> ${g[1]} ${field(g[0],'was/were + -ing')} ${g[2]} ${g[3]}</div>`).join('')}</div><p class="note"></p></div>${buttons()}`}
const reportActions={Tom:['was practising in the music room','was practising','was playing music'],Emma:['was working on a presentation','was working with her friend','was working on her presentation','was preparing a presentation'],Lucy:['was talking to her brother','was talking on the phone','was talking to her brother on the phone'],Jack:['was carrying a sports bag','was carrying a large sports bag','was walking past the trophy case','was carrying the trophy','was stealing the trophy']};function select(id){let v=state.answers[id]||'';return `<select data-field="${id}" id="${id}"><option value="">Choose</option><option value="true" ${v==='true'?'selected':''}>True</option><option value="false" ${v==='false'?'selected':''}>False</option></select>`}function page4(){return `<h2>Detective’s Report</h2><p class="lead">Use the evidence to complete your report. Who was telling the truth?</p><div class="exercise glass"><table class="report"><thead><tr><th>Suspect</th><th>What were they doing at 8:30?</th><th>Was the alibi true?</th></tr></thead><tbody>${['Tom','Emma','Lucy','Jack'].map(n=>`<tr><td>${n}</td><td>${field('r'+n,'Write a full Past Continuous phrase')}</td><td>${select('a'+n)}</td></tr>`).join('')}</tbody></table><div class="two-col"><div><h3>Who took the trophy?</h3><select id="culprit" data-field="culprit"><option value="">Choose a suspect</option>${['Tom','Emma','Lucy','Jack'].map(n=>`<option ${state.answers.culprit===n?'selected':''}>${n}</option>`).join('')}</select></div><div><h3>Explain your answer in 1–2 sentences.</h3><textarea id="reason" data-field="reason" placeholder="I think ... took the trophy because ...">${esc(state.answers.reason||'')}</textarea></div></div></div>${buttons()}<div id="result" class="hidden"></div>`}
function norm(s){return String(s||'').toLowerCase().replace(/[’']/g,'').replace(/\bwasnt\b/g,'was not').replace(/\bwerent\b/g,'were not').replace(/\s+/g,' ').replace(/[.!?,]/g,'').trim()}function grammarOK(actual,expected){return norm(actual)===norm(expected)}function mark(id,ok){let el=document.getElementById(id);if(el&&el.classList){el.classList.toggle('wrong',!ok);el.classList.toggle('correct',ok)}}function feedback(msg,ok){let el=document.getElementById('feedback');el.textContent=msg;el.className='feedback '+(ok?'good':'bad')}
function check(){if(state.teacher){state.teacherAnswers=true;save();render();return}capture();let page=state.page,correct=0,total=0;if(page===0){let answers=['1','1','1','1'];total=4;answers.forEach((a,i)=>{if(state.answers['q'+i]===a)correct++})}else if(page===1||page===2){let list=page===1?grammar:evGrammar;total=list.length;list.forEach(g=>{let ok=grammarOK(state.answers[g[0]],g[4]);mark(g[0],ok);if(ok)correct++})}else{total=10;let truths={Tom:'true',Emma:'true',Lucy:'true',Jack:'false'};Object.keys(reportActions).forEach(n=>{let a=norm(state.answers['r'+n]);let ok=reportActions[n].some(x=>norm(x)===a);mark('r'+n,ok);if(ok)correct++;if(state.answers['a'+n]===truths[n])correct++});if(state.answers.culprit==='Jack')correct++;let reason=norm(state.answers.reason);if(reason.length>=25&&/(gym|training|practice|shirt|camera|cctv|bag)/.test(reason)&&/jack|he|his/.test(reason))correct++}
if(correct===total){state.completed[page]=true;if(page<3)state.unlocked=Math.max(state.unlocked,page+1);if(page===3)state.solved=true;save();feedback(page===3?'Excellent detective work! The case is solved.':`Excellent! ${correct}/${total} correct. The next page is unlocked.`,true);nav();if(page===3){showResult();submitResults()}else{let next=document.querySelector('.footer .btn:last-of-type');if(next)next.disabled=false}}else{feedback(`${correct}/${total} correct. Check your answers and try again.`,false)} }
function scoreDetails(){let rows=[];let ok=0,total=0;function add(label,actual,good){total++;if(good)ok++;rows.push(`[${total}] ${String(actual||'(blank)').replace(/[\r\n]+/g,' ')} (${good?'OK':'ERR'})`)}let q=['1','1','1','1'];q.forEach((v,i)=>add('q'+i,state.answers['q'+i]===undefined?'':(['A painting','A sports trophy','A laptop'][Number(state.answers['q'+i])])||state.answers['q'+i],state.answers['q'+i]===v));[...grammar,...evGrammar].forEach(g=>add(g[0],state.answers[g[0]],grammarOK(state.answers[g[0]],g[4])));let truths={Tom:'true',Emma:'true',Lucy:'true',Jack:'false'};Object.keys(reportActions).forEach(n=>{let a=norm(state.answers['r'+n]);add('r'+n,state.answers['r'+n],reportActions[n].some(x=>norm(x)===a));add('a'+n,state.answers['a'+n],state.answers['a'+n]===truths[n])});add('culprit',state.answers.culprit,state.answers.culprit==='Jack');let reason=norm(state.answers.reason);add('reason',state.answers.reason,reason.length>=25&&/(gym|training|practice|shirt|camera|cctv|bag)/.test(reason)&&/jack|he|his/.test(reason));return {ratio:`${ok}/${total}`,allAnswers:rows.join('; ')}}
async function submitResults(){if(state.teacher||state.sent||!state.name||!state.solved)return;let info=scoreDetails();let box=document.getElementById('send-status');if(box)box.textContent='Sending your results…';try{await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({name:state.name,taskName:'GW_B1_The_Case_of_the_Missing_Trophy',ratio:info.ratio,allAnswers:info.allAnswers})});state.sent=true;save();if(box)box.textContent='Results submitted. Please ask your teacher to confirm the row in Google Sheets.'}catch(err){if(box)box.innerHTML='Could not send results. <button class="btn secondary" onclick="submitResults()">Try again</button>'}}
function showResult(){let el=document.getElementById('result');if(!el)return;el.className='result';el.innerHTML=`<h3>🏆 Case Solved!</h3><p><b>Jack took the trophy.</b> He claimed he was watching basketball practice, but the gym was empty at 8:30 pm. The CCTV camera showed a student carrying a large sports bag past the trophy case. Jack said he was watching basketball practice, but it had finished at 8:00 pm.</p><p><b>Grammar mission complete:</b> was / were + verb-ing.</p><p id="send-status" class="note"></p><button class="btn secondary" onclick="restart()">Start Again</button>`}function restart(){if(!confirm('Start the investigation again? Your answers will be cleared.'))return;let n=state.name,t=state.teacher;localStorage.removeItem(KEY);state={page:0,unlocked:t?3:0,completed:[false,false,false,false],answers:{},solved:false,name:n,teacher:t,teacherAnswers:false,sent:false};save();render()}document.addEventListener('input',e=>{if(e.target.matches('[data-field]')){state.answers[e.target.dataset.field]=e.target.value;save()}});document.addEventListener('change',e=>{if(e.target.matches('[data-radio]')){state.answers[e.target.dataset.radio]=e.target.value;save()}});render();
</script></body></html>
